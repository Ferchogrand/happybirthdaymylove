<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Feliz Cumpleaños</title>

  <!-- Nuevas tipografías románticas: Great Vibes (caligráfica) + Lora (serif romántica) + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Librería ligera de confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-beige: #F6EFE4;
      --bg-beige-soft: #FBF7F0;
      --text-burgundy: #4A151B;
      --text-muted: #8F6B68;
      --red-vivid: #E02433;
      --red-crimson: #B81D2A;
      --red-deep: #7A121B;
      --envelope-beige: #E5D3B8;
      --envelope-flap: #D9C3A3;
      --envelope-pocket: #ECDEC8;
      --letter-beige: #EFE0C9;
      --letter-line: rgba(184, 29, 42, 0.13);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-beige);
      background-image: radial-gradient(rgba(184, 29, 42, 0.045) 1px, transparent 0);
      background-size: 20px 20px;
      color: var(--text-burgundy);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      position: relative;
      padding: 28px 22px 60px;
    }

    /* Botón flotante de música */
    .music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(184, 29, 42, 0.25);
      background: rgba(251, 247, 240, 0.88);
      backdrop-filter: blur(6px);
      color: var(--red-crimson);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(74, 21, 27, 0.1);
      transition: transform 0.2s ease;
    }

    .music-btn.visible {
      display: flex;
    }

    .music-btn.playing svg {
      animation: spinSlow 6s linear infinite;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* =========================================
       GLOBOS FLOTANTES AL DESBLOQUEAR
       ========================================= */
    .balloons-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      overflow: hidden;
    }

    .rising-balloon {
      position: absolute;
      bottom: -160px;
      width: 68px;
      height: 140px;
      opacity: 0;
      animation: floatBalloonUp 3.6s cubic-bezier(0.22, 0.85, 0.36, 1) forwards;
    }

    .rising-balloon.left {
      left: 22%;
      animation-delay: 0.05s;
    }

    .rising-balloon.right {
      right: 22%;
      animation-delay: 0.28s;
      animation-duration: 3.9s;
    }

    @keyframes floatBalloonUp {
      0% {
        transform: translateY(0) translateX(0) rotate(-4deg) scale(0.85);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      45% {
        transform: translateY(-48vh) translateX(14px) rotate(5deg) scale(1);
        opacity: 1;
      }
      78% {
        transform: translateY(-88vh) translateX(-10px) rotate(-4deg) scale(1.02);
        opacity: 0.92;
      }
      100% {
        transform: translateY(-125vh) translateX(8px) rotate(3deg) scale(1);
        opacity: 0;
      }
    }

    /* =========================================
       PANTALLA 1: PRELOADER DEL CORAZÓN VIVO
       ========================================= */
    .intro-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-beige);
      background-image: radial-gradient(rgba(184, 29, 42, 0.045) 1px, transparent 0);
      background-size: 20px 20px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .intro-screen.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .intro-name {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: 3.2rem;
      color: var(--red-crimson);
      margin-bottom: 2px;
      line-height: 1.1;
    }

    .intro-hint {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .heart-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      outline: none;
      user-select: none;
      animation: heartbeat 1.5s infinite ease-in-out;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .heart-btn:active {
      transform: scale(0.84);
    }

    .heart-btn svg {
      width: 52px;
      height: 52px;
      fill: var(--red-vivid);
      filter: drop-shadow(0 8px 16px rgba(224, 36, 51, 0.35));
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.14); }
      30% { transform: scale(1); }
      45% { transform: scale(1.09); }
    }

    .floating-mini-heart {
      position: absolute;
      pointer-events: none;
      color: var(--red-vivid);
      font-size: 15px;
      animation: floatUpHeart 0.9s ease-out forwards;
    }

    @keyframes floatUpHeart {
      0% { opacity: 1; transform: translate(0, 0) scale(0.7); }
      100% { opacity: 0; transform: translate(var(--tx), -58px) scale(1.25); }
    }

    .progress-track {
      width: 195px;
      height: 7px;
      background: rgba(217, 195, 163, 0.55);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #E86F78, var(--red-vivid));
      border-radius: 999px;
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* =========================================
       PANTALLA 2: TARJETA PRINCIPAL
       ========================================= */
    .main-card {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      display: none;
    }

    .main-card.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Lora', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.55rem;
      line-height: 1.28;
      color: var(--red-crimson);
      margin-bottom: 6px;
    }

    .card-date {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* =========================================
       MARCO POLAROID & CARRUSEL
       ========================================= */
    .polaroid-frame {
      background: var(--bg-beige-soft);
      padding: 14px 14px 18px;
      border-radius: 4px;
      border: 1px solid rgba(217, 195, 163, 0.45);
      box-shadow: 0 12px 30px rgba(74, 21, 27, 0.09), 0 2px 6px rgba(74, 21, 27, 0.04);
      margin: 0 auto;
      max-width: 320px;
      position: relative;
      user-select: none;
    }

    .polaroid-viewport {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #EDE3D4;
      position: relative;
      border-radius: 2px;
      touch-action: pan-y;
    }

    .polaroid-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.42s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .polaroid-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
    }

    .polaroid-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(251, 247, 240, 0.82);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--red-crimson);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.88;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 2;
    }

    .carousel-nav:hover { opacity: 1; transform: translateY(-50%) scale(1.08); }
    .carousel-nav.prev { left: 8px; }
    .carousel-nav.next { right: 8px; }

    .polaroid-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D8C5B8;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.active {
      background: var(--red-vivid);
      width: 16px;
      border-radius: 999px;
    }

    .polaroid-doodles {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0.8;
    }

    .wave-divider {
      display: flex;
      justify-content: center;
      margin: 24px 0;
      color: var(--red-crimson);
      opacity: 0.45;
    }

    /* =========================================
       SOBRE BEIGE & SELLO DE LACRE ROJO
       ========================================= */
    .envelope-section {
      max-width: 330px;
      margin: 0 auto;
      perspective: 1000px;
    }

    .envelope-hint {
      text-align: center;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      transition: opacity 0.3s ease;
    }

    .envelope-closed {
      width: 100%;
      height: 195px;
      background: var(--envelope-beige);
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(74, 21, 27, 0.13);
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .envelope-closed:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(74, 21, 27, 0.17);
    }

    .envelope-closed::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.22) 0%, transparent 45%),
        linear-gradient(210deg, rgba(255,255,255,0.22) 0%, transparent 45%);
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 115px;
      background: var(--envelope-flap);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
      box-shadow: 0 4px 10px rgba(74, 21, 27, 0.08);
    }

    .envelope-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: var(--envelope-pocket);
      clip-path: polygon(0 100%, 50% 15%, 100% 100%);
      z-index: 2;
    }

    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--red-vivid), var(--red-crimson) 65%, var(--red-deep));
      box-shadow: 0 4px 12px rgba(74, 21, 27, 0.32), inset 0 2px 4px rgba(255, 255, 255, 0.28);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .wax-seal::after {
      content: "";
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 230, 230, 0.38);
    }

    .wax-seal span {
      position: absolute;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.7rem;
      color: #FFF5F5;
      letter-spacing: 0.4px;
    }

    .envelope-closed.opening .wax-seal {
      transform: translate(-50%, -50%) scale(1.3);
      opacity: 0;
    }

    .envelope-closed.opening .envelope-flap {
      transform: rotateX(180deg);
    }

    /* Hoja de la carta desplegada */
    .letter-sheet {
      display: none;
      background-color: var(--letter-beige);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        var(--letter-line) 28px
      );
      border: 1px solid rgba(184, 29, 42, 0.14);
      border-radius: 6px;
      padding: 24px 22px 28px;
      box-shadow: 0 14px 34px rgba(74, 21, 27, 0.12);
      position: relative;
      animation: unfoldLetter 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .letter-sheet.open {
      display: block;
    }

    @keyframes unfoldLetter {
      0% {
        opacity: 0;
        transform: translateY(-20px) scaleY(0.85);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
      }
    }

    .letter-top-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 1.15rem;
    }

    .letter-body {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.04rem;
      line-height: 28px;
      color: var(--text-burgundy);
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .letter-highlight {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: 1.65rem;
      line-height: 1.25;
      text-align: center;
      color: var(--red-crimson);
      padding-top: 6px;
    }

    .close-letter-btn {
      display: block;
      margin: 18px auto 0;
      background: none;
      border: 1px solid rgba(184, 29, 42, 0.28);
      color: var(--red-crimson);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 15px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s, background 0.2s;
    }

    .close-letter-btn:hover {
      opacity: 1;
      background: rgba(184, 29, 42, 0.06);
    }

    /* =========================================
       SECCIÓN DE BRINDIS Y FOTO FINAL
       ========================================= */
    .toast-section {
      text-align: center;
      margin-top: 34px;
    }

    .cheers-animation {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 54px;
      margin-bottom: 18px;
    }

    .glass-left, .glass-right {
      font-size: 2rem;
      display: inline-block;
      transform-origin: bottom center;
    }

    .glass-left {
      animation: clinkLeft 2.4s infinite ease-in-out;
    }

    .glass-right {
      animation: clinkRight 2.4s infinite ease-in-out;
      margin-left: -4px;
    }

    .sparkle {
      position: absolute;
      top: 0;
      font-size: 0.85rem;
      color: var(--red-vivid);
      opacity: 0;
      animation: sparklePop 2.4s infinite ease-in-out;
    }

    @keyframes clinkLeft {
      0%, 100% { transform: rotate(-6deg); }
      40% { transform: rotate(14deg) translateX(3px); }
      55% { transform: rotate(-4deg); }
    }

    @keyframes clinkRight {
      0%, 100% { transform: rotate(6deg) scaleX(-1); }
      40% { transform: rotate(-14deg) translateX(-3px) scaleX(-1); }
      55% { transform: rotate(4deg) scaleX(-1); }
    }

    @keyframes sparklePop {
      0%, 35%, 75%, 100% { opacity: 0; transform: scale(0.5) translateY(4px); }
      45% { opacity: 1; transform: scale(1.2) translateY(-4px); }
    }

    .final-photo-card {
      background: var(--bg-beige-soft);
      border: 1px solid rgba(217, 195, 163, 0.45);
      padding: 12px 12px 20px;
      border-radius: 4px;
      box-shadow: 0 10px 26px rgba(74, 21, 27, 0.08);
      max-width: 290px;
      margin: 0 auto;
    }

    .final-photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 2px;
      display: block;
      margin-bottom: 14px;
    }

    .final-caption {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--red-crimson);
      line-height: 1.4;
      padding: 0 8px;
    }

    .footer-brand {
      text-align: center;
      margin-top: 34px;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Capa para los globos que suben al completar el corazón -->
  <div id="balloonsLayer" class="balloons-layer" aria-hidden="true"></div>

  <!-- Botón de audio opcional -->
  <button id="musicBtn" class="music-btn" aria-label="Música de fondo" title="Pausar / Reproducir música">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </button>
  <audio id="bgMusic" loop preload="none"></audio>

  <!-- PANTALLA 1: CORAZÓN ROJO VIVO INTERACTIVO -->
  <section id="introScreen" class="intro-screen">
    <h1 id="introName" class="intro-name">Cris</h1>
    <p id="introHint" class="intro-hint">Toca el corazón</p>

    <div class="heart-wrapper" id="heartWrapper">
      <button id="heartBtn" class="heart-btn" aria-label="Tocar corazón">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>
    </div>

    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <span id="progressLabel" class="progress-label">0%</span>
  </section>

  <!-- PANTALLA 2: CONTENIDO DE LA TARJETA -->
  <main id="mainCard" class="app-shell main-card">
    <header class="card-header">
      <h2 id="mainTitle" class="card-title">Hoy es el cumpleaños<br>de mi persona favorita</h2>
      <p id="mainDate" class="card-date">18 de junio</p>
    </header>

    <!-- Marco Polaroid con Carrusel -->
    <div class="polaroid-frame">
      <div class="polaroid-viewport" id="polaroidViewport">
        <div class="polaroid-track" id="polaroidTrack"></div>
        <button class="carousel-nav prev" id="prevSlide" aria-label="Anterior">&#10094;</button>
        <button class="carousel-nav next" id="nextSlide" aria-label="Siguiente">&#10095;</button>
      </div>

      <div class="polaroid-dots" id="polaroidDots"></div>

      <!-- Adornos inferiores minimalistas en rojo y beige -->
      <div class="polaroid-doodles" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#B81D2A" stroke-width="1.3" stroke-linecap="round">
          <line x1="16" y1="3" x2="16" y2="10"/><line x1="16" y1="22" x2="16" y2="29"/>
          <line x1="3" y1="16" x2="10" y2="16"/><line x1="22" y1="16" x2="29" y2="16"/>
          <line x1="6.8" y1="6.8" x2="11.5" y2="11.5"/><line x1="20.5" y1="20.5" x2="25.2" y2="25.2"/>
          <line x1="25.2" y1="6.8" x2="20.5" y2="11.5"/><line x1="11.5" y1="20.5" x2="6.8" y2="25.2"/>
        </svg>

        <svg width="64" height="22" viewBox="0 0 64 22" fill="none">
          <path d="M2 4 Q32 14 62 4" stroke="#8F6B68" stroke-width="1.2" fill="none"/>
          <polygon points="8,6 14,7 10,14" fill="#E02433"/>
          <polygon points="19,8 25,9 21,16" fill="#D9C3A3"/>
          <polygon points="30,9 36,9 33,17" fill="#9E1924"/>
          <polygon points="41,8 47,7 45,15" fill="#E02433"/>
          <polygon points="51,6 57,5 55,13" fill="#D9C3A3"/>
        </svg>

        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#B81D2A" stroke-width="1.3" stroke-linecap="round">
          <line x1="16" y1="3" x2="16" y2="10"/><line x1="16" y1="22" x2="16" y2="29"/>
          <line x1="3" y1="16" x2="10" y2="16"/><line x1="22" y1="16" x2="29" y2="16"/>
          <line x1="6.8" y1="6.8" x2="11.5" y2="11.5"/><line x1="20.5" y1="20.5" x2="25.2" y2="25.2"/>
          <line x1="25.2" y1="6.8" x2="20.5" y2="11.5"/><line x1="11.5" y1="20.5" x2="6.8" y2="25.2"/>
        </svg>
      </div>
    </div>

    <!-- Separador ondulado -->
    <div class="wave-divider" aria-hidden="true">
      <svg width="34" height="12" viewBox="0 0 34 12" fill="none">
        <path d="M2 6 C7 1, 12 1, 17 6 C22 11, 27 11, 32 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Sobre Beige y Carta -->
    <section class="envelope-section">
      <p id="envelopeHint" class="envelope-hint">Toca el sobre para abrir tu carta</p>

      <div id="envelopeClosed" class="envelope-closed" role="button" tabindex="0" aria-label="Abrir sobre">
        <div class="envelope-flap"></div>
        <div class="envelope-bottom"></div>
        <div class="wax-seal">
          <span id="sealText">Para ti</span>
        </div>
      </div>

      <article id="letterSheet" class="letter-sheet">
        <div class="letter-top-icons" aria-hidden="true">
          <span>🎈</span><span>❤️</span><span>🎈</span>
        </div>
        <div id="letterBody" class="letter-body"></div>
        <p id="letterHighlight" class="letter-highlight"></p>
        <button id="closeLetterBtn" class="close-letter-btn">Cerrar sobre</button>
      </article>
    </section>

    <!-- Brindis + Foto Final -->
    <section class="toast-section">
      <div class="cheers-animation" aria-hidden="true">
        <span class="sparkle">✨</span>
        <span class="glass-left">🥂</span>
        <span class="glass-right">🥂</span>
      </div>

      <div class="final-photo-card">
        <img id="finalPhoto" src="" alt="Recuerdo especial" />
        <p id="finalCaption" class="final-caption"></p>
      </div>
    </section>

    <footer class="footer-brand">Hecho con amor</footer>
  </main>

  <script>
    /* =====================================================================
       CONFIGURACIÓN CENTRAL (Edita aquí los datos de cada cliente)
       ===================================================================== */
    const CONFIG = {
      recipientName: "Cris",
      introInstruction: "Toca el corazón",
      clicksToUnlock: 5,

      mainTitle: "Hoy es el cumpleaños<br>de mi persona favorita",
      eventDate: "18 de junio",

      carouselPhotos: [
        "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=800&q=80"
      ],

      sealLabel: "Ábreme",

      letterText: `Hay personas que llegan
y lo cambian todo.
Pienso que ni el destino
escribiendo la mejor de las historias
habría creado a alguien tan
especial como tú.

Hoy celebro tu risa, tu luz
y tu forma de hacerme
sentir en casa.
Que la vida te siga mostrando
que no hay nada más
especial que
TÚ.`,

      letterHighlight: "Cada año tuyo es un capítulo nuevo,\ny pienso estar en todos.",

      finalPhotoUrl: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=800&q=80",
      finalMessage: "¡Feliz vuelta al sol! Que se cumplan todos tus deseos hoy y siempre.",

      musicUrl: "audio.mp3"
    };

    /* =====================================================================
       INICIALIZACIÓN Y LÓGICA DE INTERACCIÓN
       ===================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      document.title = `Feliz Cumpleaños, ${CONFIG.recipientName}`;
      document.getElementById("introName").textContent = CONFIG.recipientName;
      document.getElementById("introHint").textContent = CONFIG.introInstruction;
      document.getElementById("mainTitle").innerHTML = CONFIG.mainTitle;
      document.getElementById("mainDate").textContent = CONFIG.eventDate;
      document.getElementById("sealText").textContent = CONFIG.sealLabel;
      document.getElementById("letterBody").textContent = CONFIG.letterText;
      document.getElementById("letterHighlight").innerText = CONFIG.letterHighlight;
      document.getElementById("finalPhoto").src = CONFIG.finalPhotoUrl;
      document.getElementById("finalCaption").textContent = CONFIG.finalMessage;

      const bgMusic = document.getElementById("bgMusic");
      const musicBtn = document.getElementById("musicBtn");
      if (CONFIG.musicUrl) {
        bgMusic.src = CONFIG.musicUrl;
        musicBtn.addEventListener("click", () => {
          if (bgMusic.paused) {
            bgMusic.play();
            musicBtn.classList.add("playing");
          } else {
            bgMusic.pause();
            musicBtn.classList.remove("playing");
          }
        });
      }

      /* -------------------------------------------------
         1. CORAZÓN ROJO VIVO, GLOBOS Y BARRA DE PROGRESO
         ------------------------------------------------- */
      const heartBtn = document.getElementById("heartBtn");
      const heartWrapper = document.getElementById("heartWrapper");
      const progressFill = document.getElementById("progressFill");
      const progressLabel = document.getElementById("progressLabel");
      const introScreen = document.getElementById("introScreen");
      const mainCard = document.getElementById("mainCard");
      const balloonsLayer = document.getElementById("balloonsLayer");

      let clicks = 0;
      let unlocked = false;

      function spawnMiniHeart() {
        const mini = document.createElement("span");
        mini.className = "floating-mini-heart";
        mini.textContent = "❤";
        const randomX = (Math.random() - 0.5) * 75;
        mini.style.setProperty("--tx", `${randomX}px`);
        mini.style.left = "50%";
        mini.style.top = "35%";
        heartWrapper.appendChild(mini);
        setTimeout(() => mini.remove(), 900);
      }

      function launchTwoBalloons() {
        const balloonConfigs = [
          { side: "left", fill: "#E02433", highlight: "#FF7580", knot: "#B81D2A" },
          { side: "right", fill: "#DFC39D", highlight: "#F7EBDD", knot: "#C4A378" }
        ];

        balloonConfigs.forEach((b) => {
          const wrapper = document.createElement("div");
          wrapper.className = `rising-balloon ${b.side}`;
          wrapper.innerHTML = `
            <svg viewBox="0 0 70 145" width="68" height="140" fill="none">
              <path d="M35 76 C31 94, 41 112, 34 138" stroke="#8F6B68" stroke-width="1.3" stroke-linecap="round"/>
              <polygon points="35,70 30,77 40,77" fill="${b.knot}"/>
              <ellipse cx="35" cy="37" rx="27" ry="34" fill="${b.fill}"/>
              <ellipse cx="25" cy="24" rx="6" ry="11" transform="rotate(-22 25 24)" fill="${b.highlight}" opacity="0.55"/>
            </svg>
          `;
          balloonsLayer.appendChild(wrapper);
          setTimeout(() => wrapper.remove(), 4100);
        });
      }

      heartBtn.addEventListener("click", () => {
        if (unlocked) return;

        clicks++;
        spawnMiniHeart();

        const percent = Math.min(Math.round((clicks / CONFIG.clicksToUnlock) * 100), 100);
        progressFill.style.width = `${percent}%`;
        progressLabel.textContent = `${percent}%`;

        const scale = 1 + (clicks / CONFIG.clicksToUnlock) * 0.25;
        heartBtn.style.transform = `scale(${scale})`;
        setTimeout(() => {
          if (!unlocked) heartBtn.style.transform = "scale(1)";
        }, 160);

        if (percent >= 100) {
          unlocked = true;

          if (CONFIG.musicUrl) {
            musicBtn.classList.add("visible");
            bgMusic.play().then(() => {
              musicBtn.classList.add("playing");
            }).catch(() => {});
          }

          // Lanzar los dos globos hacia arriba
          launchTwoBalloons();

          // Confeti en paleta rojo, beige y dorado
          if (typeof confetti === "function") {
            confetti({
              particleCount: 60,
              spread: 68,
              origin: { y: 0.62 },
              colors: ["#E02433", "#B81D2A", "#E5D3B8", "#D4AF37"]
            });
          }

          setTimeout(() => {
            introScreen.classList.add("fade-out");
            mainCard.classList.add("visible");
            setTimeout(() => {
              introScreen.style.display = "none";
            }, 800);
          }, 380);
        }
      });

      /* -------------------------------------------------
         2. CARRUSEL POLAROID (Táctil + Botones)
         ------------------------------------------------- */
      const track = document.getElementById("polaroidTrack");
      const dotsContainer = document.getElementById("polaroidDots");
      const viewport = document.getElementById("polaroidViewport");
      let currentSlide = 0;
      const totalSlides = CONFIG.carouselPhotos.length;

      CONFIG.carouselPhotos.forEach((src, index) => {
        const slide = document.createElement("div");
        slide.className = "polaroid-slide";
        const img = document.createElement("img");
        img.src = src;
        img.alt = `Recuerdo ${index + 1}`;
        slide.appendChild(img);
        track.appendChild(slide);

        const dot = document.createElement("button");
        dot.className = `dot ${index === 0 ? "active" : ""}`;
        dot.ariaLabel = `Ver foto ${index + 1}`;
        dot.addEventListener("click", () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });

      const dots = dotsContainer.querySelectorAll(".dot");

      function goToSlide(index) {
        currentSlide = (index + totalSlides) % totalSlides;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle("active", i === currentSlide));
      }

      document.getElementById("prevSlide").addEventListener("click", () => goToSlide(currentSlide - 1));
      document.getElementById("nextSlide").addEventListener("click", () => goToSlide(currentSlide + 1));

      let startX = 0;
      viewport.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener("touchend", (e) => {
        const endX = e.changedTouches[0].clientX;
        const diff = startX - endX;
        if (Math.abs(diff) > 40) {
          goToSlide(diff > 0 ? currentSlide + 1 : currentSlide - 1);
        }
      });

      /* -------------------------------------------------
         3. SOBRE INTERACTIVO (Abrir y Cerrar)
         ------------------------------------------------- */
      const envelopeClosed = document.getElementById("envelopeClosed");
      const envelopeHint = document.getElementById("envelopeHint");
      const letterSheet = document.getElementById("letterSheet");
      const closeLetterBtn = document.getElementById("closeLetterBtn");

      function openEnvelope() {
        if (envelopeClosed.classList.contains("opening")) return;
        envelopeClosed.classList.add("opening");
        envelopeHint.style.opacity = "0";

        setTimeout(() => {
          envelopeClosed.style.display = "none";
          envelopeHint.style.display = "none";
          letterSheet.classList.add("open");
        }, 550);
      }

      envelopeClosed.addEventListener("click", openEnvelope);
      envelopeClosed.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") openEnvelope();
      });

      closeLetterBtn.addEventListener("click", () => {
        letterSheet.classList.remove("open");
        envelopeClosed.classList.remove("opening");
        envelopeClosed.style.display = "block";
        envelopeHint.style.display = "block";
        setTimeout(() => { envelopeHint.style.opacity = "1"; }, 50);
      });
    });
  </script>
</body>
</html>
